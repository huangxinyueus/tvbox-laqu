name: TVBox Helper Auto Run

on:
  # 1. 允许手动点击按钮触发
  workflow_dispatch:
  
  # 2. 定时自动触发（每天 UTC 时间 0点和12点，即北京时间早上 8点和晚上 20点）
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      # 步骤一：检出仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步骤二：配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 步骤三：安装脚本依赖
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 步骤四：智能备用源检测（状态码200即成功、60秒超时与重试）、自动切换、运行助手并发送多路 TG 通知
      - name: Run TVBox Helper with Smart Fallback & Retries
        env:
          TG_TOKEN_1: ${{ secrets.TG_TOKEN_1 }}
          TG_CHAT_1: ${{ secrets.TG_CHAT_1 }}
          TG_TOKEN_2: ${{ secrets.TG_TOKEN_2 }}
          TG_CHAT_2: ${{ secrets.TG_CHAT_2 }}
          TG_TOKEN_3: ${{ secrets.TG_TOKEN_3 }}
          TG_CHAT_3: ${{ secrets.TG_CHAT_3 }}
          TG_TOKEN_4: ${{ secrets.TG_TOKEN_4 }}
          TG_CHAT_4: ${{ secrets.TG_CHAT_4 }}
          TG_TOKEN_5: ${{ secrets.TG_TOKEN_5 }}
          TG_CHAT_5: ${{ secrets.TG_CHAT_5 }}
          TG_TOKEN_6: ${{ secrets.TG_TOKEN_6 }}
          TG_CHAT_6: ${{ secrets.TG_CHAT_6 }}
          TG_TOKEN_7: ${{ secrets.TG_TOKEN_7 }}
          TG_CHAT_7: ${{ secrets.TG_CHAT_7 }}
          TG_TOKEN_8: ${{ secrets.TG_TOKEN_8 }}
          TG_CHAT_8: ${{ secrets.TG_CHAT_8 }}
          TG_TOKEN_9: ${{ secrets.TG_TOKEN_9 }}
          TG_CHAT_9: ${{ secrets.TG_CHAT_9 }}
          TG_TOKEN_10: ${{ secrets.TG_TOKEN_10 }}
          TG_CHAT_10: ${{ secrets.TG_CHAT_10 }}
        run: |
          python -c "
          import os, re, requests, time, sys
          from datetime import datetime, timezone, timedelta
          from io import StringIO
          import tvbox_helper

          bj_time = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S')

          sources_raw = []
          if os.path.exists('sources_list.txt'):
              with open('sources_list.txt', 'r', encoding='utf-8') as f:
                  sources_raw = [line.strip() for line in f if line.strip()]

          new_sources_lines = []
          source_results = []
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          for idx, line in enumerate(sources_raw, 1):
              if line.startswith('#'):
                  new_sources_lines.append(line)
                  continue
              
              parts = line.split(',', 1)
              name = parts[0].strip() if len(parts) > 1 else f'源{idx}'
              url_part = parts[1] if len(parts) > 1 else line
              
              # 提取该行所有的 URL
              urls = [u.strip() for u in re.split(r'[|\s]+', url_part) if u.strip().startswith('http')]
              
              if not urls:
                  source_results.append(f'📌 <b>源 [{idx}] ({name})</b>\n状态: ❌ 失败 (未在行中找到有效网址)\n时间: {bj_time}')
                  new_sources_lines.append(line)
                  continue
                  
              working_url = None
              fail_details = []
              
              # 依次测试主地址和备用地址
              for u_idx, url in enumerate(urls, 1):
                  addr_type = '主地址' if u_idx == 1 else f'备用地址 {u_idx-1}'
                  success = False
                  last_err = ''
                  
                  # 增加重试机制（最多尝试 2 次，超时时间设为 60 秒）
                  for attempt in range(2):
                      try:
                          res = requests.get(url, headers=headers, timeout=60)
                          # 核心调整：只要能正常打开返回 200，就判定为连通成功（支持网站导航、HTML及各种格式）
                          if res.status_code == 200:
                              success = True
                              break
                          else:
                              last_err = f'HTTP 错误码 {res.status_code}'
                      except requests.exceptions.ConnectionError:
                          last_err = '网络连接/域名解析错误（网站无法打开）'
                      except requests.exceptions.Timeout:
                          last_err = '请求超时 (60s)'
                      except Exception as e:
                          last_err = f'异常 {str(e)}'
                      
                      if attempt < 1:
                          time.sleep(2) # 重试前等待 2 秒
                  
                  if success:
                      working_url = url
                      source_results.append(f'📌 <b>源 [{idx}] ({name})</b>\n状态: ✅ 成功 (通过 <b>{addr_type}</b> 连通)\n地址: {url}\n时间: {bj_time}')
                      break
                  else:
                      fail_details.append(f'{addr_type} ({url}): {last_err}')
                      
              if not working_url:
                  details_str = '\n  '.join(fail_details)
                  source_results.append(f'📌 <b>源 [{idx}] ({name})</b>\n状态: ❌ <b>全部地址失效</b>\n  {details_str}\n时间: {bj_time}')
                  new_sources_lines.append(line)
              else:
                  # 将成功的可用地址排在最前面
                  other_urls = [u for u in urls if u != working_url]
                  reordered_urls = [working_url] + other_urls
                  reordered_line = f'{name},' + ' | '.join(reordered_urls) if len(parts) > 1 else working_url
                  new_sources_lines.append(reordered_line)

          # 写回优化后的 sources_list.txt
          with open('sources_list.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(new_sources_lines) + '\n')

          # 模拟内部键盘输入运行原程序
          sys.stdin = StringIO('4\n0\n')
          try:
              tvbox_helper.main()
          except SystemExit:
              pass

          # 组合推送内容（每个源之间空一行，在 TG 中更直观）
          details_text = '\n\n'.join(source_results)
          message = f'<b>📊 TVBox 智能备用源检测与运行报告</b>\n\n{details_text}'

          # 依次向 10 个 Telegram 机器人发送详细报告
          for i in range(1, 11):
              token = os.getenv(f'TG_TOKEN_{i}')
              chat_id = os.getenv(f'TG_CHAT_{i}')
              if token and chat_id:
                  url_tg = f'https://api.telegram.org/bot{token}/sendMessage'
                  try:
                      requests.post(url_tg, json={
                          'chat_id': chat_id, 
                          'text': message, 
                          'parse_mode': 'HTML'
                      }, timeout=10)
                  except Exception as e:
                      print(f'Telegram Bot {i} 发送失败: {e}')
          "

      # 步骤五：自动将脚本运行后生成/更新的文件提交并推送到仓库
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.io'
          git add -A
          
          # 检查是否有文件改动，若无改动则跳过提交
          if git diff --staged --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "Auto-update TVBox data via GitHub Actions"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
