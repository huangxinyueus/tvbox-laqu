name: TVBox Helper Auto Run

on:
  # 1. 允许手动点击按钮触发
  workflow_dispatch:
  
  # 2. 定时自动触发（每天 UTC 时间 0点和12点，即北京时间早上 8点和晚上 20点）
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      # 步骤一：检出仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步骤二：配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 步骤三：安装脚本依赖
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 步骤四：使用 Python 内部模拟输入，完美绕过云端无法交互的问题
      - name: Run TVBox Helper
        run: |
          python -c "
          import sys
          from io import StringIO
          import tvbox_helper

          # 模拟键盘自动输入：先输入 4（对应你的菜单选项），再输入 0（对应退出）
          sys.stdin = StringIO('4\n0\n')

          try:
              tvbox_helper.main()
          except SystemExit:
              pass
          "

      # 步骤五：自动将脚本运行后生成/更新的文件提交并推送到仓库
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.io'
          git add -A
          
          # 检查是否有文件改动，若无改动则跳过提交
          if git diff --staged --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "Auto-update TVBox data via GitHub Actions"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 步骤六：依次向 10 个 Telegram 机器人发送通知
      - name: Send Telegram Notifications
        env:
          TG_TOKEN_1: ${{ secrets.TG_TOKEN_1 }}
          TG_CHAT_1: ${{ secrets.TG_CHAT_1 }}
          TG_TOKEN_2: ${{ secrets.TG_TOKEN_2 }}
          TG_CHAT_2: ${{ secrets.TG_CHAT_2 }}
          TG_TOKEN_3: ${{ secrets.TG_TOKEN_3 }}
          TG_CHAT_3: ${{ secrets.TG_CHAT_3 }}
          TG_TOKEN_4: ${{ secrets.TG_TOKEN_4 }}
          TG_CHAT_4: ${{ secrets.TG_CHAT_4 }}
          TG_TOKEN_5: ${{ secrets.TG_TOKEN_5 }}
          TG_CHAT_5: ${{ secrets.TG_CHAT_5 }}
          TG_TOKEN_6: ${{ secrets.TG_TOKEN_6 }}
          TG_CHAT_6: ${{ secrets.TG_CHAT_6 }}
          TG_TOKEN_7: ${{ secrets.TG_TOKEN_7 }}
          TG_CHAT_7: ${{ secrets.TG_CHAT_7 }}
          TG_TOKEN_8: ${{ secrets.TG_TOKEN_8 }}
          TG_CHAT_8: ${{ secrets.TG_CHAT_8 }}
          TG_TOKEN_9: ${{ secrets.TG_TOKEN_9 }}
          TG_CHAT_9: ${{ secrets.TG_CHAT_9 }}
          TG_TOKEN_10: ${{ secrets.TG_TOKEN_10 }}
          TG_CHAT_10: ${{ secrets.TG_CHAT_10 }}
        run: |
          python -c "
          import os, requests
          message = '✅ TVBox 助手已成功自动更新并推送最新数据！'
          for i in range(1, 11):
              token = os.getenv(f'TG_TOKEN_{i}')
              chat_id = os.getenv(f'TG_CHAT_{i}')
              if token and chat_id:
                  url = f'https://api.telegram.org/bot{token}/sendMessage'
                  try:
                      res = requests.post(url, json={'chat_id': chat_id, 'text': message}, timeout=10)
                      print(f'Telegram Bot {i} 状态: {res.status_code}')
                  except Exception as e:
                      print(f'Telegram Bot {i} 发送失败: {e}')
              else:
                  print(f'Telegram Bot {i} 未配置密钥，已跳过。')
          "