name: TVBox Helper Auto Run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run TVBox Helper
        run: |
          python -c "
          import sys
          from io import StringIO
          import tvbox_helper

          sys.stdin = StringIO('4\n0\n')

          try:
              tvbox_helper.main()
          except SystemExit:
              pass
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.io'
          git add -A
          
          if git diff --staged --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "Auto-update TVBox data via GitHub Actions"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram Detailed Notifications
        env:
          TG_TOKEN_1: ${{ secrets.TG_TOKEN_1 }}
          TG_CHAT_1: ${{ secrets.TG_CHAT_1 }}
          TG_TOKEN_2: ${{ secrets.TG_TOKEN_2 }}
          TG_CHAT_2: ${{ secrets.TG_CHAT_2 }}
          TG_TOKEN_3: ${{ secrets.TG_TOKEN_3 }}
          TG_CHAT_3: ${{ secrets.TG_CHAT_3 }}
          TG_TOKEN_4: ${{ secrets.TG_TOKEN_4 }}
          TG_CHAT_4: ${{ secrets.TG_CHAT_4 }}
          TG_TOKEN_5: ${{ secrets.TG_TOKEN_5 }}
          TG_CHAT_5: ${{ secrets.TG_CHAT_5 }}
          TG_TOKEN_6: ${{ secrets.TG_TOKEN_6 }}
          TG_CHAT_6: ${{ secrets.TG_CHAT_6 }}
          TG_TOKEN_7: ${{ secrets.TG_TOKEN_7 }}
          TG_CHAT_7: ${{ secrets.TG_CHAT_7 }}
          TG_TOKEN_8: ${{ secrets.TG_TOKEN_8 }}
          TG_CHAT_8: ${{ secrets.TG_CHAT_8 }}
          TG_TOKEN_9: ${{ secrets.TG_TOKEN_9 }}
          TG_CHAT_9: ${{ secrets.TG_CHAT_9 }}
          TG_TOKEN_10: ${{ secrets.TG_TOKEN_10 }}
          TG_CHAT_10: ${{ secrets.TG_CHAT_10 }}
        run: |
          python -c "
          import os, re, json, requests
          from datetime import datetime, timezone, timedelta

          bj_time = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S')

          sources_raw = []
          if os.path.exists('sources_list.txt'):
              with open('sources_list.txt', 'r', encoding='utf-8') as f:
                  sources_raw = [line.strip() for line in f if line.strip() and not line.startswith('#')]

          source_results = []
          if not sources_raw:
              source_results.append('⚠️ 未在 sources_list.txt 中检测到有效订阅源。')
          else:
              for idx, line in enumerate(sources_raw, 1):
                  urls = re.findall(r'https?://[^\s|]+', line)
                  if not urls:
                      source_results.append(f'📌 <b>源 [{idx}]</b>: {line}\n状态: ❌ 失败 (未在行中匹配到有效网址)\n时间: {bj_time}')
                      continue
                  
                  target_url = urls[0]
                  display_name = line.split(',')[0] if ',' in line else target_url

                  try:
                      headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
                      res = requests.get(target_url, headers=headers, timeout=10)
                      
                      if res.status_code == 200:
                          # 核心升级：检查返回的内容是否真的是标准的 JSON 数据，而不是网页
                          try:
                              res.json()
                              source_results.append(f'📌 <b>源 [{idx}] ({display_name})</b>\n地址: {target_url}\n状态: ✅ 成功 (获取到有效JSON数据)\n时间: {bj_time}')
                          except json.JSONDecodeError:
                              # 虽然状态码是200，但内容无法被解析为 JSON（比如你碰到的 HTML 页面）
                              source_results.append(f'📌 <b>源 [{idx}] ({display_name})</b>\n地址: {target_url}\n状态: ❌ 失败 (HTTP 200 但返回了网页/非JSON数据)\n时间: {bj_time}')
                      else:
                          source_results.append(f'📌 <b>源 [{idx}] ({display_name})</b>\n地址: {target_url}\n状态: ❌ 失败 (HTTP 错误码: {res.status_code})\n时间: {bj_time}')
                          
                  except requests.exceptions.ConnectionError:
                      source_results.append(f'📌 <b>源 [{idx}] ({display_name})</b>\n地址: {target_url}\n状态: ❌ 失败 (网络连接错误或域名不存在)\n时间: {bj_time}')
                  except requests.exceptions.Timeout:
                      source_results.append(f'📌 <b>源 [{idx}] ({display_name})</b>\n地址: {target_url}\n状态: ❌ 失败 (请求超时)\n时间: {bj_time}')
                  except Exception as e:
                      source_results.append(f'📌 <b>源 [{idx}] ({display_name})</b>\n地址: {target_url}\n状态: ❌ 失败 (异常: {str(e)})\n时间: {bj_time}')

          details_text = '\n\n'.join(source_results)
          message = f'<b>📊 TVBox 助手运行与订阅源深度检测报告</b>\n\n{details_text}'

          for i in range(1, 11):
              token = os.getenv(f'TG_TOKEN_{i}')
              chat_id = os.getenv(f'TG_CHAT_{i}')
              if token and chat_id:
                  url = f'https://api.telegram.org/bot{token}/sendMessage'
                  try:
                      requests.post(url, json={
                          'chat_id': chat_id, 
                          'text': message, 
                          'parse_mode': 'HTML'
                      }, timeout=10)
                  except Exception as e:
                      print(f'Telegram Bot {i} 发送失败: {e}')
          "
