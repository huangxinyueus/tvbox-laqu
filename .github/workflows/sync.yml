name: TVBox Helper Auto Run

on:
  # 1. 允许手动点击按钮触发
  workflow_dispatch:
  
  # 2. 定时自动触发（每天 UTC 时间 0点和12点，即北京时间早上 8点和晚上 20点）
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      # 步骤一：检出仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步骤二：配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 步骤三：安装脚本依赖
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 步骤四：智能备用源检测、图片过滤与通用自定义 Jar 下载器、防抖哈希比对与 TG 多路通知
      - name: Run TVBox Helper with Smart Image Filter & Universal Jar Hunter
        env:
          TG_TOKEN_1: ${{ secrets.TG_TOKEN_1 }}
          TG_CHAT_1: ${{ secrets.TG_CHAT_1 }}
          TG_TOKEN_2: ${{ secrets.TG_TOKEN_2 }}
          TG_CHAT_2: ${{ secrets.TG_CHAT_2 }}
          TG_TOKEN_3: ${{ secrets.TG_TOKEN_3 }}
          TG_CHAT_3: ${{ secrets.TG_CHAT_3 }}
          TG_TOKEN_4: ${{ secrets.TG_TOKEN_4 }}
          TG_CHAT_4: ${{ secrets.TG_CHAT_4 }}
          TG_TOKEN_5: ${{ secrets.TG_TOKEN_5 }}
          TG_CHAT_5: ${{ secrets.TG_CHAT_5 }}
          TG_TOKEN_6: ${{ secrets.TG_TOKEN_6 }}
          TG_CHAT_6: ${{ secrets.TG_CHAT_6 }}
          TG_TOKEN_7: ${{ secrets.TG_TOKEN_7 }}
          TG_CHAT_7: ${{ secrets.TG_CHAT_7 }}
          TG_TOKEN_8: ${{ secrets.TG_TOKEN_8 }}
          TG_CHAT_8: ${{ secrets.TG_CHAT_8 }}
          TG_TOKEN_9: ${{ secrets.TG_TOKEN_9 }}
          TG_CHAT_9: ${{ secrets.TG_CHAT_9 }}
          TG_TOKEN_10: ${{ secrets.TG_TOKEN_10 }}
          TG_CHAT_10: ${{ secrets.TG_CHAT_10 }}
        run: |
          cat << 'EOF' > run_helper.py
          import os, re, requests, time, sys, json, hashlib
          from datetime import datetime, timezone, timedelta
          from io import StringIO
          from urllib.parse import urljoin, urlparse
          import tvbox_helper

          bj_time = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S')
          state_file = '.source_state.json'

          # 读取上一次保存各源状态的历史文件
          old_state = {}
          if os.path.exists(state_file):
              try:
                  with open(state_file, 'r', encoding='utf-8') as f:
                      old_state = json.load(f)
              except:
                  pass

          new_state = {}
          sources_raw = []
          if os.path.exists('sources_list.txt'):
              with open('sources_list.txt', 'r', encoding='utf-8') as f:
                  sources_raw = [line.strip() for line in f if line.strip()]

          new_sources_lines = []
          source_results = []
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}

          for idx, line in enumerate(sources_raw, 1):
              if line.startswith('#'):
                  new_sources_lines.append(line)
                  continue
              
              parts = line.split(',', 1)
              name = parts[0].strip() if len(parts) > 1 else f'源{idx}'
              url_part = parts[1] if len(parts) > 1 else line
              
              urls = [u.strip() for u in re.split(r'[|\s]+', url_part) if u.strip().startswith('http')]
              
              if not urls:
                  source_results.append(f'📌 <b>源 [{idx}] ({name})</b>\n状态: ❌ 失败 (未在行中找到有效网址)')
                  new_sources_lines.append(line)
                  continue
                  
              working_url = None
              fail_details = []
              fetched_content = None
              
              # 依次测试主地址和备用地址
              for u_idx, url in enumerate(urls, 1):
                  addr_type = '主地址' if u_idx == 1 else f'备用地址 {u_idx-1}'
                  success = False
                  last_err = ''
                  
                  for attempt in range(2):
                      try:
                          res = requests.get(url, headers=headers, timeout=10)
                          if res.status_code == 200:
                              fetched_content = res.content
                              success = True
                              break
                          else:
                              last_err = f'HTTP 错误码 {res.status_code}'
                      except requests.exceptions.ConnectionError:
                          last_err = '网络连接/域名解析错误（网站无法打开）'
                      except requests.exceptions.Timeout:
                          last_err = '请求超时 (60s)'
                      except Exception as e:
                          last_err = f'异常 {str(e)}'
                      
                      if attempt < 1:
                          time.sleep(2)
                  
                  if success:
                      working_url = url
                      break
                  else:
                      fail_details.append(f'{addr_type} ({url}): {last_err}')
                      
              if not working_url:
                  details_str = '\n  '.join(fail_details)
                  source_results.append(f'📌 <b>源 [{idx}] ({name})</b>\n状态: ❌ <b>全部地址失效</b>\n  {details_str}')
                  new_sources_lines.append(line)
              else:
                  jar_status_tip = ''
                  try:
                      text_data = fetched_content.decode('utf-8', errors='ignore')
                      parsed_json = json.loads(text_data)
                      if isinstance(parsed_json, dict):
                          spider_val = parsed_json.get('spider', '')
                          print(f"[DEBUG] 正在处理源 [{name}], 原始 spider 字段: {spider_val}")
                          
                          base_jar_name = None
                          if spider_val:
                              spider_path_part = spider_val.split(';')[0].strip()
                              lower_part = spider_path_part.lower()
                              
                              # 💡 核心升级：精准过滤图片链接（如 .png, .jpg 等），避免把壁纸当作 jar 报错
                              is_image = any(lower_part.endswith(ext) for ext in ['.png', '.jpg', '.jpeg', '.gif', '.webp', '.bmp'])
                              
                              if is_image:
                                  print(f"[INFO] 源 [{name}] 的 spider 字段为图片 ({spider_path_part)，无需下载 jar。")
                                  base_jar_name = None
                              elif lower_part.endswith('.jar'):
                                  base_jar_name = os.path.basename(spider_path_part)
                              else:
                                  # 如果包含路径或文件名
                                  if '.' in spider_path_part and not spider_path_part.endswith('/'):
                                      base_jar_name = os.path.basename(spider_path_part)
                                  else:
                                      base_jar_name = 'spider.jar'

                          if base_jar_name:
                              local_rel_path = f"sources_files/{name}/{base_jar_name}"

                              # 检查本地是否已经存在该 jar 文件
                              if os.path.exists(local_rel_path) and os.path.getsize(local_rel_path) > 1024:
                                  jar_status_tip = f' | 📦 <b>{base_jar_name} 已存在</b>'
                                  print(f"[INFO] 本地已存在 {local_rel_path}，跳过重复下载。")
                              else:
                                  # 遍历该源配置的所有主地址和备用地址，搜罗所有可能的下载链接
                                  candidate_urls = []
                                  if spider_val and spider_val.split(';')[0].strip().startswith('http') and spider_val.split(';')[0].strip().lower().endswith('.jar'):
                                      candidate_urls.append(spider_val.split(';')[0].strip())

                                  for u in urls:
                                      parsed_u = urlparse(u)
                                      u_domain_root = f"{parsed_u.scheme}://{parsed_u.netloc}"
                                      if u.endswith('/'):
                                          u_base_dir = u
                                      else:
                                          u_base_dir = u.rsplit('/', 1)[0] + '/'

                                      if spider_val and not spider_val.split(';')[0].strip().startswith('http'):
                                          clean_path = spider_val.split(';')[0].strip().lstrip('./').lstrip('/')
                                          candidate_urls.append(urljoin(u_base_dir, clean_path))
                                          candidate_urls.append(urljoin(u, clean_path))

                                      candidate_urls.append(urljoin(u_base_dir, base_jar_name))
                                      candidate_urls.append(f"{u_domain_root}/{base_jar_name}")
                                      candidate_urls.append(f"{u_domain_root}/lib/{base_jar_name}")
                                      candidate_urls.append(f"{u_domain_root}/spider.jar")
                                      candidate_urls.append(f"{u_domain_root}/fty.jar")

                                  # 去重候选链接保持顺序
                                  seen_cu = set()
                                  unique_candidates = []
                                  for cu in candidate_urls:
                                      if cu not in seen_cu:
                                          seen_cu.add(cu)
                                          unique_candidates.append(cu)
                                  candidate_urls = unique_candidates

                                  print(f"[DEBUG] 联动主备用地址的最终候选 Jar 链接列表: {candidate_urls}, 自定义目标路径: {local_rel_path}")

                                  # 开始尝试下载并进行内容校验
                                  downloaded = False
                                  for d_url in candidate_urls:
                                      try:
                                          s_res = requests.get(d_url, headers=headers, timeout=30)
                                          print(f"[DEBUG] 请求备用/主地址 {d_url} -> 状态码: {s_res.status_code}, 大小: {len(s_res.content)}")
                                          if s_res.status_code == 200 and len(s_res.content) > 1024:
                                              content_sample = s_res.content[:50].lower()
                                              if b'html' not in content_sample and b'png' not in content_sample and b'jpeg' not in content_sample:
                                                  target_dir = os.path.dirname(os.path.abspath(local_rel_path))
                                                  if target_dir:
                                                      os.makedirs(target_dir, exist_ok=True)
                                                  with open(local_rel_path, 'wb') as sf:
                                                      sf.write(s_res.content)
                                                  jar_status_tip = f' | 📦 <b>{base_jar_name} 同步成功</b>'
                                                  print(f"[SUCCESS] 成功保存 jar 到自定义目录: {local_rel_path}")
                                                  downloaded = True
                                                  break
                                      except Exception as ex:
                                          print(f"[ERROR] 下载异常: {ex}")
                                          continue
                                  
                                  if not downloaded:
                                      jar_status_tip = f' | ❌ <b>抓取jar失败</b>'
                                      print(f"[WARNING] 源 [{name}] 的 jar 文件在所有主备用地址中均未命中，抓取失败。")
                          else:
                              # 无需下载 jar（例如图片链接或空 spider 字段）
                              jar_status_tip = ''

                      normalized_str = json.dumps(parsed_json, sort_keys=True, ensure_ascii=False)
                  except Exception as je:
                      print(f"[ERROR] 解析 JSON 失败: {je}")
                      text_data = fetched_content.decode('utf-8', errors='ignore')
                      normalized_str = re.sub(r'\s+', '', text_data)

                  content_hash = hashlib.md5(normalized_str.encode('utf-8')).hexdigest()
                  
                  prev_info = old_state.get(name, {})
                  prev_hash = prev_info.get('hash', '')
                  prev_time = prev_info.get('time', bj_time)
                  
                  if content_hash != prev_hash:
                      update_status = '✨ 内容已更新'
                      last_update_time = bj_time
                  else:
                      update_status = '🟢 内容无变化'
                      last_update_time = prev_time
                      
                  new_state[name] = {
                      'hash': content_hash,
                      'time': last_update_time
                  }
                  
                  source_results.append(f'📌 <b>源 [{idx}] ({name})</b>\n状态: ✅ 成功 | {update_status}{jar_status_tip}\n地址: {working_url}\n最后更新时间: {last_update_time}')
                  
                  other_urls = [u for u in urls if u != working_url]
                  reordered_urls = [working_url] + other_urls
                  reordered_line = f'{name},' + ' | '.join(reordered_urls) if len(parts) > 1 else working_url
                  new_sources_lines.append(reordered_line)

          # 保存状态文件
          with open(state_file, 'w', encoding='utf-8') as f:
              json.dump(new_state, f, ensure_ascii=False, indent=2)

          # 写回优化后的 sources_list.txt
          with open('sources_list.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(new_sources_lines) + '\n')

          # 模拟内部键盘输入运行原程序
          sys.stdin = StringIO('4\n0\n')
          try:
              tvbox_helper.main()
          except SystemExit:
              pass

          # 组合推送内容（每个源之间空一行，在 TG 中更直观）
          details_text = '\n\n'.join(source_results)
          message = f'<b>📊 TVBox 智能备用源独立监控报告</b>\n\n{details_text}'

          # 依次向 10 个 Telegram 机器人发送详细报告
          for i in range(1, 11):
              token = os.getenv(f'TG_TOKEN_{i}')
              chat_id = os.getenv(f'TG_CHAT_{i}')
              if token and chat_id:
                  url_tg = f'https://api.telegram.org/bot{token}/sendMessage'
                  try:
                      requests.post(url_tg, json={
                          'chat_id': chat_id, 
                          'text': message, 
                          'parse_mode': 'HTML'
                      }, timeout=10)
                  except Exception as e:
                      print(f'Telegram Bot {i} 发送失败: {e}')
          EOF
          python run_helper.py

      # 步骤五：自动将脚本运行后生成/更新的文件强制提交并推送到仓库（绕过 .gitignore 限制）
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.io'
          # 使用强制添加参数 -f，确保所有子目录下的 .jar 文件即使被 .gitignore 拦截也能成功提交
          git add -f -A
          
          # 检查是否有文件改动，若无改动则跳过提交
          if git diff --staged --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "Auto-update TVBox data, smart image filter and custom folder jar files via GitHub Actions"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
