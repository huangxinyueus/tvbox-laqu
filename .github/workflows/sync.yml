name: TVBox Helper Auto Run

on:
  # 1. 允许手动点击按钮触发
  workflow_dispatch:
  
  # 2. 定时自动触发（每天 UTC 时间 0点和12点，即北京时间早上 8点和晚上 20点）
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      # 步骤一：检出仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 步骤二：配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 步骤三：安装脚本依赖（这里手动安装了 requests）
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          # 如果你的脚本还用到了其他库（如 beautifulsoup4 等），也可以在这里加：
          # pip install beautifulsoup4

      # 步骤四：运行你的主脚本并自动传入选项（这里以自动输入数字 "4" 为例）
      - name: Run TVBox Helper
        run: |
          # 自动输入 4（批量处理），如果运行完需要按其他键或退出，可以根据需要调整
          echo "4" | python tvbox_helper.py

      # 步骤五：自动将脚本运行后生成/更新的文件提交并推送到仓库
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.io'
          git add -A
          
          # 检查是否有文件改动，若无改动则跳过提交
          if git diff --staged --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "Auto-update TVBox data via GitHub Actions"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}