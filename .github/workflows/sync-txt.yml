name: Sync TVBox Sources and Assets

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 运行智能同步与依赖解析脚本
        env:
          BOT1_TOKEN: ${{ secrets.BOT1_TOKEN }}
          BOT1_CHAT: ${{ secrets.BOT1_CHAT }}
          BOT2_TOKEN: ${{ secrets.BOT2_TOKEN }}
          BOT2_CHAT: ${{ secrets.BOT2_CHAT }}
          BOT3_TOKEN: ${{ secrets.BOT3_TOKEN }}
          BOT3_CHAT: ${{ secrets.BOT3_CHAT }}
          BOT4_TOKEN: ${{ secrets.BOT4_TOKEN }}
          BOT4_CHAT: ${{ secrets.BOT4_CHAT }}
          BOT5_TOKEN: ${{ secrets.BOT5_TOKEN }}
          BOT5_CHAT: ${{ secrets.BOT5_CHAT }}
          BOT6_TOKEN: ${{ secrets.BOT6_TOKEN }}
          BOT6_CHAT: ${{ secrets.BOT6_CHAT }}
          BOT7_TOKEN: ${{ secrets.BOT7_TOKEN }}
          BOT7_CHAT: ${{ secrets.BOT7_CHAT }}
          BOT8_TOKEN: ${{ secrets.BOT8_TOKEN }}
          BOT8_CHAT: ${{ secrets.BOT8_CHAT }}
          BOT9_TOKEN: ${{ secrets.BOT9_TOKEN }}
          BOT9_CHAT: ${{ secrets.BOT9_CHAT }}
          BOT10_TOKEN: ${{ secrets.BOT10_TOKEN }}
          BOT10_CHAT: ${{ secrets.BOT10_CHAT }}
        run: |
          python3 - << 'EOF'
          import os
          import re
          import json
          import urllib.request
          import urllib.parse
          import subprocess
          from datetime import datetime

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          os.makedirs("sources_files", exist_ok=True)

          if not os.path.exists("sources.txt"):
              print("错误: sources.txt 文件不存在！")
              exit(1)

          def send_tg(text):
              for i in range(1, 11):
                  token = os.environ.get(f"BOT{i}_TOKEN")
                  chat = os.environ.get(f"BOT{i}_CHAT")
                  if token and chat:
                      try:
                          data = urllib.parse.urlencode({'chat_id': chat, 'parse_mode': 'Markdown', 'text': text}).encode('utf-8')
                          req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
                          urllib.request.urlopen(req, timeout=10)
                      except Exception as e:
                          print(f"Bot {i} 发送失败: {e}")

          def format_url(raw_url):
              parsed = urllib.parse.urlparse(raw_url)
              try:
                  netloc = parsed.netloc.encode('idna').decode('utf-8')
              except Exception:
                  netloc = parsed.netloc
              path = urllib.parse.quote(parsed.path)
              query = urllib.parse.quote(parsed.query, safe='=&?/')
              return urllib.parse.urlunparse((parsed.scheme, netloc, path, parsed.params, query, parsed.fragment))

          with open("sources.txt", "r", encoding="utf-8") as f:
              lines = f.readlines()

          success_sources = []
          failed_sources = []

          for line in lines:
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              
              if "," in line:
                  name, url_part = line.split(",", 1)
                  name = name.strip()
                  url_part = url_part.strip()
              else:
                  name = "source_unknown"
                  url_part = line.strip()

              urls = [u.strip() for u in url_part.split("|") if u.strip()]
              success = False

              for raw_url in urls:
                  url = format_url(raw_url)
                  clean_url = url.split("?")[0]
                  
                  # 默认后缀处理
                  ext = "txt"
                  match = re.search(r'\.([a-zA-Z0-9]+)$', clean_url)
                  if match:
                      ext = match.group(1)
                  elif "json" in clean_url or "/tv" in clean_url:
                      ext = "json" # 将类似 /tv 的接口统一规范为 json 后缀
                  
                  target_file = os.path.join("sources_files", f"{name}.{ext}")
                  print(f"正在尝试拉取源 [{name}]: {url}")
                  
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": UA})
                      with urllib.request.urlopen(req, timeout=15) as response:
                          if response.status == 200:
                              content = response.read()
                              with open(target_file, "wb") as out_f:
                                  out_f.write(content)
                              print(f"✅ [{name}] 主文件成功拉取并保存")
                              success = True
                              
                              # 💡 核心升级：无论后缀是什么，只要下载成功，就自动扫描内容中的依赖链接
                              try:
                                  file_text = content.decode('utf-8', errors='ignore')
                                  potential_links = re.findall(r'https?://[^\s"\'<>\\#]+', file_text)
                                  for link in potential_links:
                                      link = format_url(link.rstrip('\\"'))
                                      if any(link.lower().endswith(x) for x in ['.jar', '.py', '.txt', '.zip']):
                                          dep_filename = link.split('/')[-1].split('?')[0]
                                          if not dep_filename:
                                              continue
                                          dep_target = os.path.join("sources_files", f"{name}_{dep_filename}")
                                          print(f"-> 发现关联依赖文件，正在顺藤摸瓜下载: {link}")
                                          try:
                                              dep_req = urllib.request.Request(link, headers={"User-Agent": UA})
                                              with urllib.request.urlopen(dep_req, timeout=15) as dep_resp:
                                                  if dep_resp.status == 200:
                                                      with open(dep_target, "wb") as dep_out:
                                                          dep_out.write(dep_resp.read())
                                                      print(f"✅ 依赖文件下载成功: {dep_filename}")
                                          except Exception as de:
                                              print(f"⚠️ 依赖文件下载失败跳过: {de}")
                              except Exception as je:
                                  print(f"⚠️ 解析文件依赖异常: {je}")
                              break
                  except Exception as e:
                      print(f"⚠️ 地址访问异常 {raw_url}: {e}")

              if success:
                  success_sources.append(name)
              else:
                  failed_sources.append(name)

          current_date = datetime.now().strftime('%Y-%m-%d %H:%M:%S')

          subprocess.run(["git", "config", "--global", "user.name", "github-actions[bot]"])
          subprocess.run(["git", "config", "--global", "user.email", "github-actions[bot]@users.noreply.github.com"])
          subprocess.run(["git", "add", "sources_files/"])
          
          diff_res = subprocess.run(["git", "diff", "--staged", "--quiet"])
          is_changed = (diff_res.returncode != 0)

          if is_changed:
              subprocess.run(["git", "commit", -m, f"Auto-sync sources & assets: {current_date}"])
              subprocess.run(["git", "push"])
              print("✅ 成功将已获取的源文件同步推送至 GitHub 仓库。")
          else:
              print("ℹ️ 仓库中的文件无实质变动。")

          msg_lines = [f"📊 *TVBox 源同步报告*", f"📅 *时间*: `{current_date}`", ""]
          
          if success_sources:
              msg_lines.append(f"🟢 *拉取成功的源 ({len(success_sources)})*:")
              for s in success_sources:
                  msg_lines.append(f"  - `{s}` (已同步至仓库)")
              msg_lines.append("")

          if failed_sources:
              msg_lines.append(f"❌ *拉取失败的源 ({len(failed_sources)})*:")
              for f_src in failed_sources:
                  msg_lines.append(f"  - `{f_src}` (所有备用地址失效)")
              msg_lines.append("")

          if not failed_sources:
              if is_changed:
                msg_lines.append("✨ *状态*: **所有源全部更新成功并已同步！**")
              else:
                msg_lines.append("ℹ️ *状态*: **所有源内容均无变化，今天没更新。**")
          else:
              msg_lines.append("⚠️ *状态*: **部分源同步失败，成功拉取的内容已正常入库。**")

          final_msg = "%0A".join(msg_lines)
          send_tg(final_msg)

          if failed_sources:
              exit(1)
          EOF
