name: Sync TVBox Sources from TXT

on:
  schedule:
    # 每 2 小时自动同步一次
    - cron: '0 */12 * * *'
  workflow_dispatch: # 支持手动点击立即触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写入权限

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 读取 txt 并批量拉取
        run: |
          mkdir -p json
          
          if [ ! -f "sources.txt" ]; then
            echo "错误: sources.txt 文件不存在！"
            exit 1
          fi

          index=1
          while IFS= read -r url || [ -n "$url" ]; do
            # 去除空格和回车，跳过空行或 # 开头的注释行
            url=$(echo "$url" | tr -d '\r' | xargs)
            if [[ -z "$url" || "$url" == \#* ]]; then
              continue
            fi

            echo "正在同步第 $index 个源 -> $url"
            # 自动按顺序命名保存为 json/source_1.json, json/source_2.json ...
            curl -s -L "$url" -o "json/source_${index}.json" || echo "警告: 第 $index 个源拉取失败"
            index=$((index + 1))
          done < sources.txt

      - name: 检查并提交更改
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add json/
          
          if git diff --staged --quiet; then
            echo "所有源内容均无变化，跳过提交。"
          else
            git commit -m "Auto-sync sources from txt: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi